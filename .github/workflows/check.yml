name: Synthetic checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      # The pipeline must replace this value with a local synthetic path.
      MTAH_DATA_DIR: CI_SYNTHETIC_ONLY_DO_NOT_OPEN
    steps:
      - name: Check out the code repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Check sources, environment and tests
        run: python -X utf8 phase1.py check

      - name: Run the full synthetic demo
        run: python -X utf8 phase1.py demo

      - name: Compare methods on shared synthetic input
        run: python -X utf8 phase1.py improve

      - name: Check that tracked files were not modified
        run: git diff --exit-code

      # Do not upload or cache data, predictions or reports.
