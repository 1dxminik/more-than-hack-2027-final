name: Kontrola syntetyczna

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      # Pipeline musi zastąpić tę wartość lokalną ścieżką syntetyczną.
      MTAH_DATA_DIR: CI_SYNTHETIC_ONLY_DO_NOT_OPEN
    steps:
      - name: Pobierz wyłącznie repozytorium kodu
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Przygotuj Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Zainstaluj przypięte zależności
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Sprawdź źródła, środowisko i testy
        run: python -X utf8 phase1.py check

      - name: Sprawdź pełne demo syntetyczne
        run: python -X utf8 phase1.py demo

      - name: Porównaj pięć metod na wspólnej syntetyce
        run: python -X utf8 phase1.py improve

      - name: Sprawdź, czy przebieg nie zmienił śledzonych plików
        run: git diff --exit-code

      # Bez upload-artifact i cache danych, predykcji oraz raportów.
